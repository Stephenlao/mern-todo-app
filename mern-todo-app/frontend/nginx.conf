server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls from the browser go to the same origin (/api/...) and are forwarded
    # to the backend container over the internal Docker network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: unknown paths (/login, /register, /resetPassword...) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
